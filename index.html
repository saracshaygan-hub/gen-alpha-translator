<!DOCTYPE html>
<html>
<head>
  <title>Gen Alpha Translator</title>
</head>
<body style="font-family: Arial; padding: 40px; max-width: 500px; margin: auto;">

  <h2>Gen Alpha Translator</h2>

  <textarea id="input" style="width:100%; height:100px;"></textarea>

  <br><br>

  <select id="mode">
    <option value="alpha">English → Gen Alpha</option>
    <option value="english">Gen Alpha → English</option>
  </select>

  <select id="tone">
    <option>Mild</option>
    <option>Medium</option>
    <option>Unhinged</option>
  </select>

  <br><br>

  <button onclick="doTranslation()">Translate</button>

  <p id="output"></p>

  <script>
    async function doTranslation() {
      const text = document.getElementById("input").value;
      const mode = document.getElementById("mode").value;
      const tone = document.getElementById("tone").value;

      document.getElementById("output").innerText = "Translating...";

      const res = await fetch("/api/translate", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ text, mode, tone })
      });

      const data = await res.json();
      document.getElementById("output").innerText = data.output;
    }
  </script>

</body>
</html>
